<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bricks // Classic Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <header class="cabinet-header"><a href="../index.html">&larr; Portfolio</a><span>BRICKS / GAME 02</span></header>
    <section class="screen" aria-labelledby="title">
      <div class="screen-top"><div><p>CLASSIC HANDHELD</p><h1 id="title">Bricks</h1></div><div class="score"><span>SCORE <b id="score">000000</b></span><span>LEVEL <b id="level">01</b></span><span>LINES <b id="lines">000</b></span></div></div>
      <div class="play-area">
        <div class="board-wrap"><canvas id="board" width="240" height="480" aria-label="Bricks game board"></canvas><div id="message" class="message">PRESS START</div></div>
        <aside class="side-panel"><div><span>SPEED</span><strong id="speed">1</strong></div><div><span>NEXT</span><canvas id="next" width="96" height="96" aria-label="Next brick preview"></canvas></div></aside>
      </div>
      <div class="actions"><button id="start" type="button">Start game</button><button id="pause" type="button">Pause</button></div>
      <div class="touch-controls" aria-label="Brick controls"><button data-action="left" aria-label="Move left">&#9664;</button><button data-action="rotate" aria-label="Rotate brick">&#8635;</button><button data-action="right" aria-label="Move right">&#9654;</button><button data-action="down" aria-label="Drop brick">&#9660;</button></div>
      <p class="hint">Arrow keys or WASD to move. Up rotates. Space drops the brick.</p>
    </section>
    <footer class="cabinet-footer"><span>INSERT COIN</span><span>HIGH SCORE <b id="best">000000</b></span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
